{% extends "layout.html" %}

{% block title %}Profile{% endblock %}

{% block main %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm">
            <div class="card-body">
                <h3 class="card-title text-center mb-4">My Profile</h3>

                <form action="/profile" method="post">

                    <div class="mb-3">
                        <label class="form-label text-muted small">Username (Cannot be changed)</label>
                        <input class="form-control bg-light" type="text" value="{{ user.username }}" disabled>
                    </div>

                    <div class="row mb-3">
                        <div class="col">
                            <label class="form-label text-muted small">First Name</label>
                            <input class="form-control" name="name" type="text" value="{{ user.name }}" required>
                        </div>
                        <div class="col">
                            <label class="form-label text-muted small">Last Name</label>
                            <input class="form-control" name="surname" type="text" value="{{ user.surname }}" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label text-muted small">Gender</label>
                        <select class="form-select" name="gender" required>
                            <option value="male" {% if user.gender=='male' %}selected{% endif %}>Male</option>
                            <option value="female" {% if user.gender=='female' %}selected{% endif %}>Female</option>
                            <option value="other" {% if user.gender=='other' %}selected{% endif %}>Other</option>
                        </select>
                    </div>

                    <div class="mb-4">
                        <label class="form-label text-muted small">Birthday</label>
                        <input class="form-control" name="birthday" type="date" value="{{ user.birthday }}" required>
                    </div>

                    <hr class="mb-4">
                    <h5 class="mb-3">Change Password</h5>

                    <div class="mb-3">
                        <input class="form-control" name="new_password" placeholder="New Password (min. 8 characters)"
                            type="password" minlength="8">
                    </div>
                    <div class="mb-4">
                        <input class="form-control" name="confirmation" placeholder="Confirm New Password"
                            type="password" minlength="8">
                    </div>

                    <div class="d-grid">
                        <button class="btn btn-success" type="submit">Save Changes</button>
                    </div>
                </form>

            </div>
        </div>
    </div>
</div>
{% endblock %}
